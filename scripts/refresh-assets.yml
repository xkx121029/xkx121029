name: Refresh profile assets

# 每 6 小时（UTC 0/6/12/18 = 北京时间 8/14/20/2 点）自动重抓一次。
# 也可在 Actions 页面手动 Run workflow 立即刷新。
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/refresh-assets.mjs'
      - '.github/workflows/refresh-assets.yml'

permissions:
  contents: write

concurrency:
  group: refresh-profile-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-assets.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          if git diff --cached --quiet; then
            echo "本次无变化，不提交"
          else
            git commit -m "chore: refresh profile assets [skip ci]"
            git push
          fi
